[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orclaw"
version = "0.1.0"
description = "Self-hosted multi-agent orchestrator. Ship parallel GitHub issues with Claude — paid by your Pro plan, not the API."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Orclaw contributors" }]
keywords = ["orchestration", "claude", "anthropic", "github", "multi-agent", "ai-coding", "self-hosted"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Topic :: Software Development :: Build Tools",
  "Development Status :: 3 - Alpha",
]

dependencies = [
  # CLI
  "click>=8.1.0",
  "rich>=13.7.0",
  # Config
  "tomli>=2.0.0; python_version<'3.11'",
  # HTTP / GitHub
  "httpx>=0.27.0",
  # Async runtime
  "anyio>=4.3.0",
  # Observability
  "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=4.1.0",
  "ruff>=0.4.0",
  "mypy>=1.10.0",
  "types-toml",
]
dashboard = [
  # Sprint 5: HTTP dashboard
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.29.0",
  "jinja2>=3.1.0",
]
specialist = [
  # Sprint 8: MCP server for the specialist agent. Pin to a recent SDK
  # so we get the streamable-http transport.
  "mcp>=1.2.0",
]

[project.scripts]
orclaw = "orclaw.cli:main"

[project.urls]
Homepage = "https://github.com/${GITHUB_USERNAME}/orclaw"
Repository = "https://github.com/${GITHUB_USERNAME}/orclaw"

[tool.hatch.build.targets.wheel]
packages = ["orclaw"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E",      # pycodestyle errors
  "W",      # pycodestyle warnings
  "F",      # pyflakes
  "I",      # isort
  "B",      # bugbear
  "C4",     # comprehensions
  "UP",     # pyupgrade
  "SIM",    # simplify
  "RUF",    # ruff-specific
  "TCH",    # type-checking imports
]
ignore = [
  "E501",   # line too long (formatter handles)
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
  "--showlocals",
]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "slow: tests slow (>1s, skip by default)",
  "integration: tests that hit external services (mocked by default)",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
disallow_untyped_defs = true
exclude = ["build/", "dist/", ".venv/"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

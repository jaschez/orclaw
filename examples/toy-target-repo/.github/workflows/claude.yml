# claude.yml — the only workflow your target repo strictly needs.
#
# Triggered by Orclaw posting `@claude implement #N` (or `@claude review`)
# as an issue/PR comment. Runs on YOUR self-hosted runner so the action
# can authenticate against your Pro-plan session instead of the API.
#
# After Claude finishes, it labels the PR (`agent:ready`) and Orclaw's
# next tick picks up the label via the pollback pass.
#
# Required repo secrets / variables — set in:
#   Settings → Secrets and variables → Actions:
#   • CLAUDE_CODE_OAUTH_TOKEN  (Pro-plan session token; see action docs)
#   • A repo variable ORCLAW_RUNNER pointing at the self-hosted runner
#     label (e.g. "self-hosted-runner-1"). Defaults to ubuntu-latest if
#     unset, which falls back to API billing — don't.

name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ${{ vars.ORCLAW_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # If you also want to give the action access to a few MCPs,
          # add them here. The orclaw specialist MCP is a great fit
          # because the action can then read engine state mid-run
          # (e.g. "this issue is layer 2, blockers are #41 #42").
          # mcp_servers: |
          #   {
          #     "orclaw": {
          #       "type": "http",
          #       "url": "https://your-orclaw.example.com/mcp"
          #     }
          #   }
